  - name: v4female002
    audio_path: assets/v4female002_001246.wav
    prompt_text: "嗯，好的。那我们这边也帮您再次催促一下我们的对应门店，然后也辛苦您保持一下电话畅通。"
  - name: v4male001
    audio_path: assets/v4male001_001083.wav
    prompt_text: "嗯，好的，了解。那我们这边会把这个情况呢，直接反馈到餐厅的。"

  - name: v4male002
    audio_path: assets/v4male002_004364.wav
    prompt_text: "我们这边看不到啊，早餐的话你可以到我们这边。"
  - name: v4female003
